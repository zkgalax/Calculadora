<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style1.css">
    <title>Calculadora zKGalax</title>
</head>
    <body>
        <h1 class="titulo">Calculadora</h1>
        <div class="estilo-card">
            <input type="text" class="pantallita2" id="pantalla2" disabled>
            <div class="pocion-botones">
                <button onclick="numeros('1')" class="boton5">1️⃣</button>
                <button onclick="numeros('2')" class="boton5">2️⃣</button>
                <button onclick="numeros('3')" class="boton5">3️⃣</button>
                <button onclick="numeros('4')" class="boton5">4️⃣</button>
                <button onclick="numeros('5')" class="boton5">5️⃣</button>
                <button onclick="numeros('6')" class="boton5">6️⃣</button>
                <button onclick="numeros('7')" class="boton5">7️⃣</button>
                <button onclick="numeros('8')" class="boton5">8️⃣</button>
                <button onclick="numeros('9')" class="boton5">9️⃣</button>
                <button onclick="numeros('0')" class="boton5">0️⃣</button>
                <button onclick="numeros('+')" class="boton5">➕</button>
                <button onclick="numeros('-')" class="boton5">➖</button>
                <button onclick="numeros('x')" class="boton5">✖️</button>
                <button onclick="numeros('/')" class="boton5">➗</button>
                <button onclick="operacion()" class="boton5">🟰</button>
                <button onclick="BorrarUnoPorUno()" class="boton5">Borrar</button>
                <button onclick="BorrarTodo()" class="boton5">❌</button>
            </div>
        </div>
        <script src="JS/script1.js"></script>
    </body>
</html>
